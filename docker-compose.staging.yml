services:
  web:
    build: .
    container_name: cis410-web
    ports:
      - "5001:5000"
    restart: unless-stopped
    environment:
      - ENVIRONMENT=staging
      - APP_VERSION=1.0.0
      - DEPLOY_TIME=${DEPLOY_TIME:-unknown}
      - COMMIT_SHA=${GITHUB_SHA:-local}
      - BRANCH=${GITHUB_REF_NAME:-main}
      - WORKFLOW=deploy-staging.yml
