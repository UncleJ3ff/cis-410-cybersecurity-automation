name: "Setup – Dev Server"
on:
  workflow_dispatch:

jobs:
  setup:
    name: "Install Docker on Dev VM"
    runs-on: self-hosted
    steps:
      - name: Install Docker
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no student@192.168.1.124 << 'EOF'
          set -e

          echo "=== 1. Setting up Passwordless Sudo ==="
          echo 'student ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/student
          sudo chmod 0440 /etc/sudoers.d/student

          echo "=== 2. Installing Docker Engine ==="
          if ! command -v docker &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ca-certificates curl gnupg
            sudo install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            sudo chmod a+r /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu focal stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            sudo usermod -aG docker student
          fi

          echo "=== 3. Creating App Directory ==="
          sudo mkdir -p /opt/app
          sudo chown student:student /opt/app

          echo "=== Success: Docker is ready ==="
          docker --version
          EOF
