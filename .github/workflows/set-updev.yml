name: "Setup — Dev Server"
on:
  workflow_dispatch: 

jobs:
  setup:
    name: "Install Docker on Dev VM"
    runs-on: self-hosted
    steps:
      - name: Install Docker
        run: |
          # We use the IP address directly to avoid "Host not found" errors
          sshpass -p '${{ secrets.DEV_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            student@192.168.1.124 << 'EOF'
          
          set -e
          
          echo "=== 1. Clearing background locks (Fixing Code 5) ==="
          sudo killall apt apt-get 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock-frontend
          sudo dpkg --configure -a

          echo "=== 2. Configuring Passwordless Sudo ==="
          echo 'student ALL=(ALL) NOPASSWD:ALL' | sudo tee /etc/sudoers.d/student
          sudo chmod 0440 /etc/sudoers.d/student

          echo "=== 3. Installing Docker ==="
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com -o get-docker.sh
            sudo sh get-docker.sh
            sudo usermod -aG docker student
            sudo mkdir -p /opt/app && sudo chown student:student /opt/app
            rm get-docker.sh
            echo "=== Docker installed successfully ==="
          else
            echo "=== Docker already present — ensuring folder exists ==="
            sudo mkdir -p /opt/app && sudo chown student:student /opt/app
          fi
          
          echo "=== 4. Verification ==="
          docker --version
          docker compose version
          ls -la /opt/app
          EOF
