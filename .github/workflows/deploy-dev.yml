name: "Deploy – Dev"
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and Deploy to Dev VM"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy app files to Dev VM
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            app/ Dockerfile .dockerignore docker-compose.yml \
            student@192.168.1.124:/opt/app/

      - name: Deploy Flask container
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no student@192.168.1.132 << 'EOF'
          set -e
          cd /opt/app
          export DEPLOY_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          docker compose down --remove-orphans
          DEPLOY_TIME="${DEPLOY_TIME}" GITHUB_SHA="${GITHUB_SHA}" GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            docker compose up -d --build
          EOF
