name: "Snyk Security Scan"
on:
  pull_request:
    branches: [main]

jobs:
  snyk-code:
    name: "Snyk Code Scan"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Snyk CLI
        run: |
          curl -sLo /tmp/snyk https://static.snyk.io/cli/latest/snyk-linux
          chmod +x /tmp/snyk
          sudo mv /tmp/snyk /usr/local/bin/snyk
      - name: Run Snyk Code Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high

  snyk-open-source:
    name: "Snyk Open Source Scan"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Snyk CLI
        run: |
          curl -sLo /tmp/snyk https://static.snyk.io/cli/latest/snyk-linux
          chmod +x /tmp/snyk
          sudo mv /tmp/snyk /usr/local/bin/snyk
      - name: Run Snyk Open Source Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --severity-threshold=high

  snyk-container:
    name: "Snyk Container Scan"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Snyk CLI
        run: |
          curl -sLo /tmp/snyk https://static.snyk.io/cli/latest/snyk-linux
          chmod +x /tmp/snyk
          sudo mv /tmp/snyk /usr/local/bin/snyk
      - name: Run Snyk Container Scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk container test python:3.11-slim --severity-threshold=high
