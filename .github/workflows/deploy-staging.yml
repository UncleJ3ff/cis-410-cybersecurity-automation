name: "Deploy – Staging"
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: "Build and Deploy to Staging VM"
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy app files to Staging VM
        run: |
          scp -i ~/.ssh/staging_key -o StrictHostKeyChecking=no -r \
            app/ Dockerfile .dockerignore docker-compose.staging.yml \
            student@${{ secrets.STAGING_HOST }}:/opt/app/

      - name: Deploy Flask container
        run: |
          ssh -i ~/.ssh/staging_key -o StrictHostKeyChecking=no student@${{ secrets.STAGING_HOST }} << 'EOF'
          set -e
          cd /opt/app
          export DEPLOY_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          export GITHUB_SHA="${{ github.sha }}"
          export GITHUB_REF_NAME="${{ github.ref_name }}"
          docker compose -f docker-compose.staging.yml down --remove-orphans
          DEPLOY_TIME="${DEPLOY_TIME}" GITHUB_SHA="${GITHUB_SHA}" GITHUB_REF_NAME="${GITHUB_REF_NAME}" \
            docker compose -f docker-compose.staging.yml up -d --build
          EOF
